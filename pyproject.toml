[project]
name = "bin-serializer"
version = "0.1.0"
description = "A binary serialization code generator."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
schema-serializer = "schema_serializer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serializer"]
