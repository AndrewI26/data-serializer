[project]
name = "bin-serializer"
version = "0.1.0"
description = "A binary serialization code generator."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
schema-serializer = "serializer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serializer"]
